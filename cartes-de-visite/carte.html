<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Carte de visite – Pauline Renard</title>
<style>
  @font-face { font-family: 'Bricolage'; src: url(bricolage-grotesque-latin-standard-normal.woff2) format('woff2'); font-weight: 200 800; }
  @font-face { font-family: 'Instrument Sans'; src: url(instrument-sans-latin-standard-normal.woff2) format('woff2'); font-weight: 400 700; }
  @font-face { font-family: 'Instrument Serif'; src: url(instrument-serif-latin-400-italic.woff2) format('woff2'); font-style: italic; }

  :root {
    --cream: #f6efdc;   /* fond du logo */
    --ink: #1d201c;
    --ink2: #5a5e57;
    --sage: #4a6b55;
    --sage-d: #36513f;
    --clay: #b8694a;
    --teal: #619a94;    /* cercle du logo */
    --bleed: 3mm;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { font-family: 'Instrument Sans', sans-serif; color: var(--ink); }

  /* Une face = 85 × 55 mm + 3 mm de fond perdu de chaque côté */
  .face { width: 91mm; height: 61mm; position: relative; overflow: hidden; }
  .art { position: absolute; left: 0; top: 0; width: 91mm; height: 61mm; }
  .safe { position: absolute; inset: calc(var(--bleed) + 3.5mm); }

  /* ---------- RECTO ---------- */
  .recto { background: var(--cream); }
  .recto .safe { display: flex; align-items: center; gap: 3.5mm; }
  .logo { width: 37mm; flex: none; margin-left: -3mm; margin-right: -1mm; }
  .logo img { width: 100%; display: block; mix-blend-mode: multiply; -webkit-mask-image: radial-gradient(circle closest-side at 50% 50%, #000 90%, transparent 99%); mask-image: radial-gradient(circle closest-side at 50% 50%, #000 90%, transparent 99%); }
  .txt { flex: 1; display: flex; flex-direction: column; }
  .name { font-family: 'Bricolage'; font-weight: 600; font-size: 15.5pt; line-height: .95; letter-spacing: -.02em; color: var(--sage-d); }
  .role { margin-top: 1.6mm; font-size: 5.6pt; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--teal); line-height: 1.35; }
  .rule { width: 8mm; height: .35mm; background: var(--clay); margin: 3mm 0 2.6mm; border-radius: 1mm; }
  .q { font-family: 'Instrument Serif'; font-style: italic; font-size: 10.5pt; line-height: 1.08; color: var(--ink); }
  .cta { margin-top: 2.6mm; align-self: flex-start; background: var(--clay); color: #fff; font-weight: 600; font-size: 6.6pt; padding: 1.3mm 2.8mm 1.4mm; border-radius: 10mm; letter-spacing: .01em; }

  /* ---------- VERSO ---------- */
  .verso { background: var(--sage-d); color: #f1f3ef; }
  .verso .safe { display: flex; flex-direction: column; justify-content: center; padding-left: 2mm; }
  .v-name { font-family: 'Bricolage'; font-weight: 600; font-size: 12pt; letter-spacing: -.02em; line-height: 1; }
  .v-role { font-family: 'Instrument Serif'; font-style: italic; font-size: 9pt; color: #c9dccd; margin-top: 1mm; }
  .v-rule { width: 8mm; height: .35mm; background: var(--clay); margin: 3.4mm 0 3.6mm; border-radius: 1mm; }
  ul { list-style: none; display: grid; gap: 2.3mm; }
  li { display: flex; align-items: center; gap: 2.4mm; font-size: 7.6pt; font-weight: 500; letter-spacing: .01em; }
  li .ic { width: 5.2mm; height: 5.2mm; border-radius: 50%; background: rgba(255,255,255,.12); display: grid; place-items: center; flex: none; }
  li svg { width: 2.9mm; height: 2.9mm; stroke: #fff; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  li.tel { font-size: 9.5pt; font-weight: 600; letter-spacing: .03em; }
  .qr { position: absolute; right: calc(var(--bleed) + 4mm); bottom: calc(var(--bleed) + 4mm); width: 19mm; background: var(--cream); border-radius: 1.6mm; padding: 1.5mm 1.5mm 1.1mm; text-align: center; }
  .qr img { width: 16mm; height: 16mm; display: block; }
  .qr span { display: block; margin-top: .9mm; font-size: 4.8pt; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--sage-d); }
  .zone { position: absolute; right: calc(var(--bleed) + 4mm); top: calc(var(--bleed) + 4mm); font-size: 5.4pt; letter-spacing: .14em; text-transform: uppercase; color: #c9dccd; font-weight: 600; }

  /* Impression : une face par page, fond perdu inclus */
  @page { size: 91mm 61mm; margin: 0; }
  @media print { .face { page-break-after: always; } .wrap { display: block; } }

  /* Écran : aperçu des deux faces coupées au format final */
  @media screen {
    body { background: #e8e4da; padding: 24px; }
    .wrap { display: flex; gap: 24px; flex-wrap: wrap; zoom: 2.4; }
    .face { width: 85mm; height: 55mm; box-shadow: 0 2px 10px rgba(0,0,0,.15); border-radius: .6mm; }
    .art { translate: -3mm -3mm; }
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- RECTO -->
  <section class="face recto"><div class="art">
    <div class="safe">
      <div class="logo"><img src="logo.jpg" alt="Pauline et Oslo"></div>
      <div class="txt">
        <div class="name">Pauline<br>Renard</div>
        <div class="role">Éducatrice &amp;<br>comportementaliste canin</div>
        <div class="rule"></div>
        <div class="q">Tu rêves d’un quotidien serein avec ton toutou&nbsp;?</div>
        <div class="cta">Réserve ton bilan&nbsp;!</div>
      </div>
    </div>
  </div></section>

  <!-- VERSO -->
  <section class="face verso"><div class="art">
    <div class="zone">Lyon &amp; alentours</div>
    <div class="safe">
      <div class="v-name">Pauline Renard</div>
      <div class="v-role">éducation canine bienveillante</div>
      <div class="v-rule"></div>
      <ul>
        <li class="tel"><span class="ic"><svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg></span>06 45 81 64 19</li>
        <li><span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg></span>paulinerenard-educateurcanin.fr</li>
        <li><span class="ic"><svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.6" cy="6.4" r=".6" fill="#fff"/></svg></span>@pauline_educ_oslo</li>
      </ul>
    </div>
    <div class="qr"><img src="qr-contact.svg" alt="QR code vers la page contact"><span>Réserve ici</span></div>
  </div></section>

</div>
</body>
</html>
